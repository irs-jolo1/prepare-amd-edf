# based on amd-edf small distro
require conf/distro/amd-edf-small.conf

DISTRO = "irs-distro"
DISTRO_NAME = "IRS Custom Distro"
DISTRO_VERSION = "v0.1.0"

# disable unused features
DISTRO_FEATURES:remove = "\
    3g \
    alsa \
    bluetooth \
    bluez5 \
    debuginfod \
    fbdev \
    gobject-introspection-data \
    ipv6 \
    ldconfig \
    libmali \
    multiarch \
    nfc \
    nfs \
    openamp \
    opengl \
    pam \
    pci \
    pcmcia \
    ptest \
    pulseaudio \
    security \
    systemd \
    tpm \
    usbgadget \
    vfat \
    virtualization \
    vmsep \
    wayland \
    wifi \
    x11 \
    xen \
    zeroconf \
"

# setup which rootfs types are built
# IMAGE_FSTYPES = "cpio.gz.u-boot cpio.gz"
IMAGE_FSTYPES = "cpio.gz"
# IMAGE_FSTYPES:append = " wic"'

# without sysvinit init scripts like mdev are not symlinked
DISTRO_FEATURES:append = " sysvinit"
INIT_MANAGER = "mdev-busybox"


######################
# FIT IMAGE SETTINGS #
######################

KERNEL_IMAGETYPE = "fitImage"
KERNEL_IMAGETYPES += " fitImage"
KERNEL_CLASSES += " kernel-fitimage"

# FIT_GENERATE_KEYS = "1"
# FIT_SIGN_INDIVIDUAL = "1"
# FIT_HASH_ALG = "sha256"
# FIT_SIGN_ALG = "rsa2048"

# # KERNEL_DEVICETREE = "your-board.dtb"

# irs-image (the real rootfs, built as ext4) is embedded directly into the
# fitImage as a native FIT "ramdisk" component (INITRAMFS_IMAGE_BUNDLE="0"
# means "add as a ramdisk section", as opposed to "1" which would compile
# it directly into the kernel binary with no separate FIT node at all).
# U-Boot loads the whole fitImage with a single `bootm` and the kernel's
# classic rd_load_image mechanism copies the embedded ramdisk into the
# /dev/ram0 block device (CONFIG_BLK_DEV_RAM) - see edf-linux-boot.cmd.
# No separate/tiny initramfs stage is needed: root=/dev/ram0 makes the
# kernel mount it directly as / like any other block-device root.
INITRAMFS_IMAGE = "irs-image"
INITRAMFS_IMAGE_BUNDLE = "0"
# RDEPENDS:remove:pn-core-image-minimal-initramfs = "kernel-image-fitimage"
FIT_SUPPORTED_INITRAMFS_FSTYPES = "cpio.gz"

# max RAM size (could be 2G for our current board?)
INITRAMFS_MAXSIZE = "524288"

# UBOOT_FITIMAGE_ENABLE = "1"
