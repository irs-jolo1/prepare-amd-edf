# based on amd-edf small distro
require conf/distro/amd-edf-small.conf

DISTRO = "irs-distro"
DISTRO_NAME = "IRS Custom Distro"
DISTRO_VERSION = "v0.1.0"

# disable unused features
DISTRO_FEATURES:remove = "\
    3g \
    alsa \
    bluetooth \
    bluez5 \
    debuginfod \
    fbdev \
    gobject-introspection-data \
    ipv6 \
    ldconfig \
    libmali \
    multiarch \
    nfc \
    nfs \
    openamp \
    opengl \
    pam \
    pci \
    pcmcia \
    ptest \
    pulseaudio \
    security \
    systemd \
    tpm \
    usbgadget \
    vfat \
    virtualization \
    vmsep \
    wayland \
    wifi \
    x11 \
    xen \
    zeroconf \
"

# setup which rootfs types are built
IMAGE_FSTYPES = "cpio.gz.u-boot cpio.gz"
# IMAGE_FSTYPES:append = " wic"'

# without sysvinit init scripts like mdev are not symlinked
DISTRO_FEATURES:append = " sysvinit"
INIT_MANAGER = "mdev-busybox"


######################
# FIT IMAGE SETTINGS #
######################

KERNEL_IMAGETYPE = "fitImage"
KERNEL_IMAGETYPES += " fitImage"
KERNEL_CLASSES += " kernel-fitimage"

# FIT_GENERATE_KEYS = "1"
# FIT_SIGN_INDIVIDUAL = "1"
# FIT_HASH_ALG = "sha256"
# FIT_SIGN_ALG = "rsa2048"

# # KERNEL_DEVICETREE = "your-board.dtb"

INITRAMFS_IMAGE = "irs-image"
INITRAMFS_IMAGE_BUNDLE = "1"
# RDEPENDS:remove:pn-core-image-minimal-initramfs = "kernel-image-fitimage"
