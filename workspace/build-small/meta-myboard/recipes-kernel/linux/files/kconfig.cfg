CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y

# irs-image (the real rootfs) is an ext4 image, mounted from a RAM disk
# (/dev/ram0) at boot - see irs-distro.conf/irs-image.bb/edf-linux-boot.cmd.
# Must be built-in (=y, not =m): it needs to be available before any
# modules can be loaded from the not-yet-mounted root filesystem.
CONFIG_EXT4_FS=y
CONFIG_EXT4_USE_FOR_EXT23=y

CONFIG_AXI_DMAC=m
CONFIG_PWM_AXI_PWMGEN=m
CONFIG_COMMON_CLK_AXI_CLKGEN=m
CONFIG_SPI_OFFLOAD=y
CONFIG_SPI_AXI_SPI_ENGINE=m

CONFIG_AD7768_1=m

CONFIG_CONSOLE_LOGLEVEL_DEFAULT=4
CONFIG_MESSAGE_LOGLEVEL_DEFAULT=4

# CONFIG_AD7768_AGGREGATOR=m


CONFIG_SYSTEM_TRUSTED_KEYS=""
CONFIG_SYSTEM_REVOCATION_KEYS=""
# CONFIG_MODULE_SIG_ALL is not set

# Disable bluetooth
CONFIG_BT=n
CONFIG_BT_HCIUART=n
CONFIG_BT_HCIBTUSB=y

# Disable audio
CONFIG_SOUND=n
